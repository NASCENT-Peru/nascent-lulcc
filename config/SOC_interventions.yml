# =============================================================================
# SOC_interventions.yml — Nature for Society scenario (SSP1-aligned)
# =============================================================================
#
# Spatial intervention configuration for the SOC scenario, applied inside
# generate_probability_maps() in src/allocation.r between probability
# prediction and per-transition TIF writes.
#
# Authored 2026-06-05 from the design recorded in
# spatial_interventions_integration_protocol.md §4a.
#
# Narrative anchor (from scenario_narratives.txt):
#   - Conservation expansion to 30% by 2030, prioritized for ecosystem
#     services + structural connectivity (IUCN VI, mixed national/regional).
#   - Mining: additional concessions are granted but limited to areas with
#     comparatively lower values for ecosystem services and biodiversity.
#   - Urban densification: 92% urban by 2060 (SSP1-aligned), planned with
#     green tech and circular-economy principles — same densification
#     strength as NAT in our encoding.
#   - No Indigenous_land_OECM intervention in SOC: the narrative leans
#     technocratic / ES-focused; Indigenous lands play a smaller role in
#     the spatial logic compared with NAT and CUL.
#
# Years: 4-year simulation steps from 2024 to 2060 (LULC baseline = 2022).
# Class names follow config/lulc_schema.json.
# Mask paths are relative to the project root.
#
# TODO: differentiate from NAT.  SOC currently uses the same urban
# densification settings as NAT and the same conservation mechanism with
# SOC-specific phase masks (ES+connectivity-optimised). Possible
# refinements: weaker Indigenous suppression or stronger ES-area protection
# inside high-NCP PAs.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Conservation_expansion_and_preservation
#    Hard-block high-impact transitions inside the time-staggered PA mask.
#    Mask = Deléglise-derived SOC PAs (ES+connectivity-prioritised),
#    phase-staggered:
#      phase0 (current, 17.9%) for 2024-2028
#      phase1 (target, ~30% reached by 2030) for 2032
#      phase2 (full + connectivity) for 2036-2060
# -----------------------------------------------------------------------------
- Intervention_stage: Allocation
  Intervention_ID: Conservation_expansion_and_preservation
  Intervention_ranking: 1
  Time_steps_implemented:
    - 2024
    - 2028
    - 2032
    - 2036
    - 2040
    - 2044
    - 2048
    - 2052
    - 2056
    - 2060
  Transition_target_classes:
    - built_up_and_barren_lands
    - high_intensity_agricultural_areas
    - mining
  Prob_adjust_type: Absolute
  Prob_adjust_value: 0
  Prob_adjust_zone: Inside
  Mask_type: Dynamic
  Intervention_mask:
    '2024': spatial_masks/protected_areas_mask_SOC_phase0_current.tif
    '2028': spatial_masks/protected_areas_mask_SOC_phase0_current.tif
    '2032': spatial_masks/protected_areas_mask_SOC_phase1_target.tif
    '2036': spatial_masks/protected_areas_mask_SOC_phase2_full.tif
    '2040': spatial_masks/protected_areas_mask_SOC_phase2_full.tif
    '2044': spatial_masks/protected_areas_mask_SOC_phase2_full.tif
    '2048': spatial_masks/protected_areas_mask_SOC_phase2_full.tif
    '2052': spatial_masks/protected_areas_mask_SOC_phase2_full.tif
    '2056': spatial_masks/protected_areas_mask_SOC_phase2_full.tif
    '2060': spatial_masks/protected_areas_mask_SOC_phase2_full.tif

# -----------------------------------------------------------------------------
# 2. Mining_in_low_ES_areas
#    New mining only permitted inside the low-ES mask (per-region Q25 of
#    NCP_baseline). Outside the mask: hard-block * -> mining.
#    Continuous from 2024 (the regulatory framework is in place from the
#    start, unlike NAT's post-2030 freeze).
# -----------------------------------------------------------------------------
- Intervention_stage: Allocation
  Intervention_ID: Mining_in_low_ES_areas
  Intervention_ranking: 2
  Time_steps_implemented:
    - 2024
    - 2028
    - 2032
    - 2036
    - 2040
    - 2044
    - 2048
    - 2052
    - 2056
    - 2060
  Transition_target_classes: mining
  Prob_adjust_type: Absolute
  Prob_adjust_value: 0
  Prob_adjust_zone: Outside
  Mask_type: Static
  Intervention_mask: spatial_masks/low_es_value_mask.tif

# -----------------------------------------------------------------------------
# 3. Urban_densification
#    Same settings as NAT: simultaneously boost top-percentile cells inside
#    the settlement-zone mask and suppress top-percentile cells outside.
#    SOC narrative is SSP1-aligned for urbanisation (92%); densification
#    is just as strong as NAT, just with different prioritization of how
#    new PAs are chosen.
# -----------------------------------------------------------------------------
- Intervention_stage: Allocation
  Intervention_ID: Urban_densification
  Intervention_ranking: 3
  Time_steps_implemented:
    - 2024
    - 2028
    - 2032
    - 2036
    - 2040
    - 2044
    - 2048
    - 2052
    - 2056
    - 2060
  Transition_target_classes: built_up_and_barren_lands
  Prob_adjust_type: Relative
  Prob_adjust_valency: Increase_inside_decrease_outside
  Prob_adjust_intervention_percentile: 90
  Prob_adjust_non_intervention_percentile: 90
  Prob_adjust_threshold: 5
  Prob_adjust_zone: Inside
  Mask_type: Static
  Intervention_mask: spatial_masks/urban_settlement_mask.tif
