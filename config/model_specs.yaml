global:
  num_replicates: 1     # Superseded by AutoTuner CV folds in mlr3 pipeline (Phase 2) — value ignored
  cv_folds: 3
  random_seed: 123
  max_final_fit_size: 100000  # Superseded by max_training_rows in top-level config; kept for reference

metrics:
  optimization_metric: classif.auc

models:
  glm:
    parameters:
      alpha:
        - 1      # Lasso (mixture=1 in tidymodels); matches current glmnet behaviour
      s:
        - 0.01   # penalty=0.01 in tidymodels; the lambda value for classif.glmnet

  rf:
    parameters:
      num.trees:
        - 500
      min.node.size:
        - 5
      mtry:
        - 4
      # importance and save.memory are hardcoded in train_mlr3_transition() — not tunable

  xgboost:
    parameters:
      nrounds:
        - 100
      max_depth:
        - 6
      eta:
        - 0.1
      min_child_weight:
        - 5
      colsample_bytree:
        - 0.8    # approx: mtry=4 of ~5 predictors = 0.8; operator should adjust
      # nthread is hardcoded to 1 in train_mlr3_transition() — not tunable
