name: allocation_env
channels:
  - conda-forge
dependencies:
  # Core R
  - r-base=4.3

  # Spatial libraries (required by terra)
  - gdal
  - libgdal-hdf5
  - hdf5
  - proj
  - geos

  # Spatial raster processing
  - r-terra

  # Arrow for parquet file handling
  - r-arrow

  # Data manipulation (tidyverse core)
  - r-dplyr
  - r-purrr
  - r-readr
  - r-stringr

  # Configuration and data formats
  - r-yaml
  - r-jsonlite

  # Parallel processing
  - r-future
  - r-furrr

  # Fast tabular data manipulation
  - r-data.table

  # External process management (for running Dinamica EGO)
  - r-processx

  # Base64 encoding/decoding
  - r-base64enc

  # Modelling workflows
  - r-workflows
